[tool.ruff]
# Django code runs wide, and the registry URLs assembled in registry_client.py do
# not read better wrapped.
line-length = 110
target-version = "py313"
exclude = ["ui/static/ui/vendor"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # warnings
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "DJ",  # Django-specific
]
ignore = [
    # f-strings in logging calls: the project uses them throughout and the cost of
    # eager formatting is irrelevant next to the HTTP call being logged about.
    "G004",
]

[tool.ruff.lint.per-file-ignores]
# `from .settings import *` is how a settings overlay is written.
"DockerUI/settings_test.py" = ["F403", "F405"]
